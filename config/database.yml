# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  <% if ENV["DATABASE_HOST"].present? %>
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  <% end %>
  <% if ENV["DATABASE_USERNAME"].present? %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  <% end %>
  <% if ENV["DATABASE_PASSWORD"].present? %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  <% end %>

development:
  <<: *default
  database: lakeview_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: lakeview_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "lakeview_production") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "lakeview") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  # Prefer DATABASE_URL in production:
  # url: <%= ENV["DATABASE_URL"] %>
